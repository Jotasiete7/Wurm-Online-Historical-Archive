<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wurm Archive — Historical Log Preservation</title>
    <meta name="description" content="A community-driven initiative to preserve the collective history of Wurm Online logs." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app">
      <nav class="top-nav container">
        <div class="lang-switcher">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="sep">/</span>
          <button class="lang-btn" data-lang="pt">PT</button>
        </div>
      </nav>

      <header class="container">
        <h1 data-i18n="mission_title">Preserving the <span class="accent">collective history</span> of Wurm Online.</h1>
        <p class="mission-sub" data-i18n="mission_sub">A digital archive project dedicated to the archaeology of a virtual world.</p>
      </header>

      <main class="container">
        <section class="upload-section">
          <div id="drop-zone" class="drop-zone">
            <div class="drop-zone-content">
              <div class="drop-zone-icon">⟎</div>
              <h3 data-i18n="upload_title">Drag your Trade logs here</h3>
              
              <div class="contributor-input">
                <select id="server-select">
                  <option value="nfi">Northern Freedom Isles (NFI)</option>
                  <option value="sfi">Southern Freedom Isles (SFI)</option>
                </select>
                <input type="text" id="credit-input" placeholder="Credit (Optional)" />
              </div>

              <div id="upload-status" class="upload-status"></div>
            </div>
            <input type="file" id="file-input" multiple style="display: none" />
          </div>
        </section>

        <section class="coverage-section">
          <div class="section-header">
            <h2 class="serif" data-i18n="historical_coverage">Historical Coverage</h2>
            <div class="corpus-controls">
              <button class="control-btn active" data-corpus="nfi">NFI</button>
              <button class="control-btn" data-corpus="sfi">SFI</button>
            </div>
          </div>
          <div id="coverage-timeline" class="coverage-timeline"></div>
        </section>

        <section class="archive-section">
          <h2 class="serif" data-i18n="browse_archive">Browse Archive</h2>
          <div id="archive-browser" class="archive-browser"></div>
        </section>
      </main>

      <footer class="container">
        <p>&copy; 2024 Wurm Online Historical Archive. Independent Community Project.</p>
      </footer>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
